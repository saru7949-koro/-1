# パイプライン不足分析 設定ファイル
# 実行: python3 scripts/run.py [YYYY-MM-DD]
#   1) 原本/ を 作業/snapshots/<日付>/ にコピー(原本は読むだけ)
#   2) コピーだけを読んで分析し、出力/ に Excel と Markdown を書き出す

backup_rate = 0.10   # Backupの加重(21件算出式と同じ)

[source]
pipeline_latest = "2026_10FCT_Pipeline_JP.xlsx"   # 案件Excel(最新・10FCT版)
latest_label    = "10FCT"                         # 出力での最新データの呼び名
case_id_prefix  = "P10F"                          # 案件ID の接頭辞(P10F-R<Excel行>)
pipeline_9f     = "2609_9FCT_Pipeline_JP_3.xlsx"  # 9FCT時点の案件Excel(21件算出の基準) シート: MOC Pipeline 9FCT
leads           = "FY26______________.xlsx"        # FY26新規リード分析(Salesforce生データ)
winloss         = "_FY25____________________.xlsx" # FY20-FY25 商談総括(勝敗)
measures        = "Q3_____.xlsx"                   # 施策表(Q3直近施策)

[period]
fy_start = 202604     # FY26 = 2026/4〜2027/3
fy_end   = 202703
h2_start = 202610     # 下期(今期の残り)
as_of    = "2026-10-07"

# 21件の算出式(出典: LST MOC FY26 Sep 2026 slide 2「JP 年間」)
#   着地理論値 = 成約 + FCT案件(未成約)×勝率 + Backup×10%
#   9F不足     = 着地理論値 − 9F目標
#   必要リード = 不足 ÷ 勝率
# モデル別: BGT / 9F目標 / 勝率(スライド記載値)
[models.SH]
bgt = 23
target_9f = 25
win_rate = 0.65
[models.MA]
bgt = 17
target_9f = 15
win_rate = 0.60
[models.SA]
bgt = 12
target_9f = 6
win_rate = 0.55
[models.ID]
bgt = 6
target_9f = 6
win_rate = 0.30
[models.FP]
bgt = 6
target_9f = 8
win_rate = 0.60

[carryover]
# 上期▲7台は9F目標(年間60台 = 1H実績11台+下期49台)に含まれる(2026-10-06 確認済み)。
h1_actual = 11
h1_gap = 7

[rules]
stale_days = 0            # アクション期日 < 基準日 → 期日超過
pull_forward_until = 202709   # 前倒し候補: 来期(FY27)のうちこの月までの案件
pull_forward_min_prob = 0.4
# 一次店として扱う代理店(優先順)。複数該当時は先に書いたものを一次店とする
primary_agents = ["富士フイルム和光純薬", "レスター", "池田理化", "ナカライテスク", "バイオテック・ラボ", "カーク", "アズバイオ"]

# 代理店表記の揺れ(完全一致で置換)。出典: FY26新規リード分析「4_表記揺れ変換マスタ」+ 追加分
[agent_alias]
"和光" = "富士フイルム和光純薬"
"Wako" = "富士フイルム和光純薬"
"富士フイルム和光" = "富士フイルム和光純薬"
"富士フイルム和光純薬株式会社" = "富士フイルム和光純薬"
"富士フイルム和光純薬株" = "富士フイルム和光純薬"
"ナカライ" = "ナカライテスク"
"バイオテックラボ" = "バイオテック・ラボ"
"バイオテック" = "バイオテック・ラボ"
"BTL" = "バイオテック・ラボ"          # 仮置き: BTL=バイオテック・ラボの略と解釈
"テクノ・スズタ" = "テクノスズタ"
"岩井化学薬品" = "岩井化学"
"株式会社池田理化" = "池田理化"
"池田理化つくば" = "池田理化"
"USJ" = "UBSJ"
"一次店未定" = "未定"
"和科盛商会" = "和科盛"

# 課題列のキーワード分類(原文は出力せず件数のみ)
[issue_keywords]
"予算・申請待ち" = ["予算", "申請", "補正", "科研", "AMED", "EPOCH", "ROIS"]
"見積・価格" = ["見積", "価格", "値引", "高い", "コスト"]
"競合" = ["競合", "他社", "BD", "Aurora", "Cytek", "ベックマン", "Fortessa", "SRT", "OnchipSORT"]
"デモ・評価" = ["デモ", "評価", "検証", "比較", "体験"]
"入札・手続" = ["入札", "公告", "仕様書", "稟議", "決裁"]
"時期未定・延期" = ["未定", "延期", "来期", "FY27", "FY28", "保留"]

# 挽回シナリオの率(2026-10-06 確認済み・厳しめ設定)
[scenario]
upgrade_rate = 0.15        # 下期Backup→FCT昇格率
pullback_rate = 0.10       # 来期へ移った案件の引き戻し率
lead_meeting_rate = 0.02   # リード→商談化率
telemarketing_targets = 422  # テレマ対象(電話番号保有者, Sep資料 slide6-7)
guarantee_leads = 148        # 150リード保証プランの入手件数(Sep資料 slide3)
expo_leads = 110             # 展示会1回あたりリード数の目安(FY25-Q2実績, Sep資料 slide3)
new_to_fct_rate = 0.319      # 新規登録→今期FCT化率(Sep資料 slide4: 30/94)

# 定義(2026-10-06 確認済み)
[definitions]
genre = { AC = "アカデミア", BT = "バイオテック企業", PHM = "製薬企業", BTL = "バイオテック企業" }  # BTLは定義外のためBT扱い(仮置き)
delivery = { A = "月決", B = "Q決", C = "未定" }

# Q3(2026年10〜12月)
[q3]
start = 202610
end = 202612
bgt = 18                 # Q3 BGT(2026-10-06 ユーザー提示)
backup_upgrade = 1       # 18台への道筋: Q3 Backupからの昇格(台)
pull_forward_share = 0.5 # 18台への道筋: Q4前倒し候補のうち年内受注に持ち込む割合
pf_min_prob = 0.6        # Q4前倒し候補: 確度60%以上 または 納期A/B
